<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Email-to-Cal{% endblock %}</title>
<meta name="theme-color" content="#f0f0ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1614" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/manrope-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/jetbrains-mono-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/email-to-cal.css">
<!-- The component registers itself with the core, so the core has to be first. -->
<script src="/static/basecoat.min.js" defer></script>
<script src="/static/basecoat-tabs.min.js" defer></script>
</head>
<body class="flex min-h-dvh flex-col">
{% set here = request.path %}
<header class="sticky top-0 z-20 border-b bg-background/85 backdrop-blur"
        style="padding-top: env(safe-area-inset-top)">
  {# The bar is h-14 and the buttons fill it, so each one is a target a thumb can find
     without aiming. #}
  <nav class="topbar mx-auto flex h-14 max-w-lg items-center gap-1 px-3" aria-label="Sections">
    <a class="btn text-lg" data-size="lg" href="/"
       data-variant="{{ 'secondary' if here == '/' else 'ghost' }}"
       {% if here == '/' %}aria-current="page"{% endif %}>
      <span class="brand">
        <svg class="brand-mark size-[1.1em]" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="3"/>
          <path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/>
        </svg>
        <span>Email-to-Cal</span>
      </span>
    </a>
    <a class="btn ml-auto" data-size="icon-lg" href="/settings" aria-label="Settings"
       data-variant="{{ 'secondary' if here.startswith('/settings') else 'ghost' }}"
       {% if here.startswith('/settings') %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </a>
  </nav>
</header>
<main class="mx-auto flex w-full max-w-lg flex-1 flex-col px-4 pt-4">
{% block content %}{% endblock %}
</main>
</body>
</html>
