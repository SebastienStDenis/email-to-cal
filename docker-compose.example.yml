services:
  email-to-cal:
    image: ghcr.io/OWNER/email-to-cal:latest
    container_name: email-to-cal
    restart: unless-stopped
    env_file: .env
    volumes:
      # Holds credentials.json, token.json, and state.sqlite. Back this up.
      # The same ./data the CLI uses locally, so one .env serves both.
      - ./data:/app/data
    # The container rewrites token.json after each refresh, so ./data must be writable
    # by this uid: chown -R 10001:10001 ./data
    user: "10001:10001"
