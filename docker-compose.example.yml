services:
  email-to-cal:
    image: ghcr.io/sebastienstdenis/email-to-cal:latest
    container_name: email-to-cal
    restart: unless-stopped
    ports:
      # The portal has no login, so keep it bound to localhost. On a remote server,
      # reach it with: ssh -L 8080:localhost:8080 your-server
      - "127.0.0.1:8080:8080"
    volumes:
      # Holds config.json, token.json, and state.sqlite. Back this up.
      - data:/app/data

  # Only needed for the optional local junk filter. Pull the model once with:
  #   docker exec ollama ollama pull gpt-oss:20b
  # and set the Ollama server to http://ollama:11434 in the portal's Advanced settings.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      # Model weights; survives container updates and `docker compose down`.
      - ollama:/root/.ollama

volumes:
  data:
  ollama:
