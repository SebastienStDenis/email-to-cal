[project]
name = "email-to-cal"
version = "0.1.0"
description = "Turn the emails you flag in iCloud Mail into calendar events."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "airportsdata>=20250909",
    "anthropic>=0.120.0",
    "beautifulsoup4>=4.13",
    "flask>=3.0",
    "html2text>=2025.4.15",
    "httpx>=0.28",
    "icalendar>=6.3",
    "imap-tools>=1.15",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[project.scripts]
email-to-cal = "email_to_cal.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_to_cal"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# icalendar and parts of Flask ship no type information, so calls into them are untyped.
[[tool.mypy.overrides]]
module = ["email_to_cal.cal", "email_to_cal.web"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["imap_tools.*", "airportsdata.*", "html2text.*", "icalendar.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
